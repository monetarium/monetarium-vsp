{{define "header"}}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <title>Monetarium VSP - {{ .WebApiCfg.Designation }}</title>

        <link rel="stylesheet" href="/public/css/vendor/bootstrap-4.6.2.min.css" />
        <link rel="stylesheet" href="/public/css/vspd.css?v={{ .WebApiCfg.VspdVersion }}" />
        <!-- fonts.css should be last to ensure dcr fonts take precedence. -->
        <link rel="stylesheet" href="/public/css/fonts.css?v={{ .WebApiCfg.VspdVersion }}" />

        <!--  Monetarium favicon — same set the block explorer serves, so a
              bookmarked VSP and a bookmarked explorer look like one project.  -->
        <link rel="icon" href="/public/images/favicon/favicon.ico?v={{ .WebApiCfg.VspdVersion }}" sizes="48x48">
        <link rel="icon" type="image/png" href="/public/images/favicon/favicon-96x96.png?v={{ .WebApiCfg.VspdVersion }}" sizes="96x96">
        <link rel="icon" type="image/svg+xml" href="/public/images/favicon/favicon.svg?v={{ .WebApiCfg.VspdVersion }}">
        <link rel="apple-touch-icon" sizes="180x180" href="/public/images/favicon/apple-touch-icon.png?v={{ .WebApiCfg.VspdVersion }}">
        <link rel="manifest" href="/public/images/favicon/site.webmanifest?v={{ .WebApiCfg.VspdVersion }}">
        <meta name="theme-color" content="#ffffff">
    </head>
    
    <body>
        <div class="vsp-page-content">

            <nav class="py-sm-3 px-sm-5 navbar vsp-navbar">
                <div class="container">
                    <a class="text-decoration-none py-1 border-0 d-flex justify-content-start align-items-center" href="/">
                        <div class="vsp-logo-logo">
                            <img src="/public/images/favicon/favicon.svg?v={{ .WebApiCfg.VspdVersion }}"
                                 width="38" height="38" alt="Monetarium">
                        </div>
                        <div class="vsp-logo-text">
                            VSP<br>
                            <b>{{ .WebApiCfg.Designation }}</b>
                        </div>
                    </a>
                </div>
            </nav>

            {{ if .WebApiCfg.Debug }}
                <div class="container">
                    <div class="alert alert-danger my-2 w-100 text-center font-weight-bold">
                        Web server is running in debug mode - don't do this in production!
                    </div>
                </div>
            {{ end }}

{{end}}
